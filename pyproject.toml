[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stillfleetdb"
version = "0.1.0"
description = "Plain-language page lookup over the Stillfleet core rulebook"
requires-python = ">=3.11"
dependencies = [
    "pymupdf4llm>=1.28",
]

[project.optional-dependencies]
# Phase 3 onwards; not needed to run Phase 0/1.
llm = ["anthropic>=0.40", "pyyaml>=6"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8"]

[project.scripts]
stillfleet-probe = "stillfleetdb.probe:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
